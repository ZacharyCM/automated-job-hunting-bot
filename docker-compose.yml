version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://jobbot:password123@db:5432/jobbot_db
      - ADZUNA_API_KEY=${ADZUNA_API_KEY}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
    depends_on:
      - db
    volumes:
      - ./server:/app/server
      - ./client:/app/client
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jobbot_db
      POSTGRES_USER: jobbot
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: