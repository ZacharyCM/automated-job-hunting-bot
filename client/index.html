<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Hunting Bot</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Job Hunting Bot</h1>
            <p>Find your dream engineering job automatically</p>
        </header>
        
        <main>
            <form id="jobSearchForm" class="search-form">
                <div class="form-group">
                    <input type="text" id="keywords" placeholder="e.g., New Grad Software Engineering" required>
                    <input type="text" id="location" placeholder="Location (optional)">
                    <button type="submit">Search Jobs</button>
                </div>
            </form>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Searching for jobs...</p>
            </div>
            
            <div id="results" class="results-container"></div>
        </main>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
